# Configuración de secaudit (/etc/secaudit/secaudit.conf)
# Formato: variables de shell. Se cargan con 'source' desde los scripts.

# Destinatario de las alertas por correo cuando se detectan cambios de
# severidad alta/crítica. Déjalo vacío para no enviar correo (las alertas
# seguirán quedando en journald y en /var/lib/secaudit/LAST_ALERT.txt).
# Requiere un MTA configurado (p.ej. 'mail' de bsd-mailx o 'sendmail').
MAIL_TO=""

# Módulos a ejecutar, separados por comas. Vacío = todos los módulos.
# Ejemplo para una pasada rápida sin la verificación lenta de integridad:
#   MODULES="system,users,ssh,firewall,ports,suid,permissions,rootkit,baseline"
MODULES=""

# Actualizar automáticamente la línea base tras cada ejecución.
# "no" (recomendado): la base permanece fija; tú decides cuándo refrescarla
#   con 'secaudit-baseline' tras revisar los cambios. Así no se enmascara una
#   posible intrusión por deriva gradual.
# "yes": cómodo pero solo alertarás de cambios respecto a la última ejecución.
AUTO_REBASELINE="no"

# Número de instantáneas (JSON) e informes (HTML) a conservar en
# /var/lib/secaudit/reports. Los más antiguos se borran.
KEEP_REPORTS="30"
